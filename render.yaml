services:
  - type: web
    name: wattwise
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 120 --workers 1 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
    disk:
      name: wattwise-data
      mountPath: /opt/render/project/src
      sizeGB: 1
