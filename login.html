<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WattWise — Login</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap"
    rel="stylesheet">
  <meta name="theme-color" content="#050c1a">
  <link rel="manifest" href="/manifest.json">
  <style>
    :root {
      --navy: #050c1a;
      --accent: #00d4ff;
      --gold: #ffd700;
      --success: #00e676;
      --danger: #ff3860;
      --dim: #4a6890;
      --text: #c8e0ff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--navy);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ─── Loader ─────────────────────────────── */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--navy);
      overflow: hidden;
    }

    #loader.out {
      animation: loaderOut .8s .05s forwards;
    }

    @keyframes loaderOut {
      to {
        opacity: 0;
        pointer-events: none;
      }
    }

    /* Starfield background */
    .stars {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(1px 1px at 10% 15%, rgba(255, 255, 255, .6) 0%, transparent 100%),
        radial-gradient(1px 1px at 25% 45%, rgba(255, 255, 255, .4) 0%, transparent 100%),
        radial-gradient(1px 1px at 40% 10%, rgba(255, 255, 255, .5) 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 35%, rgba(255, 255, 255, .3) 0%, transparent 100%),
        radial-gradient(1px 1px at 75% 20%, rgba(255, 255, 255, .6) 0%, transparent 100%),
        radial-gradient(1px 1px at 85% 55%, rgba(255, 255, 255, .4) 0%, transparent 100%),
        radial-gradient(1px 1px at 15% 70%, rgba(255, 255, 255, .5) 0%, transparent 100%),
        radial-gradient(1px 1px at 50% 80%, rgba(255, 255, 255, .3) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 75%, rgba(255, 255, 255, .5) 0%, transparent 100%);
    }

    /* Storm clouds */
    .clouds {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 38%;
      overflow: hidden;
    }

    .cloud {
      position: absolute;
      border-radius: 50%;
      background: rgba(20, 40, 80, .85);
      filter: blur(18px);
    }

    .c1 {
      width: 380px;
      height: 140px;
      top: -30px;
      left: -40px;
      animation: cdrift 8s ease-in-out infinite alternate;
    }

    .c2 {
      width: 500px;
      height: 160px;
      top: -20px;
      left: 30%;
      animation: cdrift 10s .5s ease-in-out infinite alternate-reverse;
    }

    .c3 {
      width: 420px;
      height: 150px;
      top: 0;
      right: -60px;
      animation: cdrift 9s 1s ease-in-out infinite alternate;
    }

    .c4 {
      width: 300px;
      height: 100px;
      top: 40px;
      left: 20%;
      animation: cdrift 7s .3s ease-in-out infinite alternate;
    }

    @keyframes cdrift {
      from {
        transform: translateX(-12px);
      }

      to {
        transform: translateX(12px);
      }
    }

    /* Screen flash overlay */
    .flash-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(180, 230, 255, .2) 0%, transparent 50%);
      opacity: 0;
      pointer-events: none;
    }

    .flash-overlay.on {
      animation: sflash .08s ease-out forwards;
    }

    @keyframes sflash {
      0% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }

    /* SVG lightning */
    #bolt-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    /* Ground glow */
    .ground-glow {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(0, 212, 255, .55), rgba(255, 215, 0, .25), transparent 68%);
      filter: blur(10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .05s;
    }

    /* Crack SVG */
    #crack-svg {
      position: absolute;
      pointer-events: none;
      overflow: visible;
      opacity: 0;
    }

    /* Sparks container */
    #sparks-container {
      position: absolute;
      pointer-events: none;
    }

    .spark {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      pointer-events: none;
    }

    /* Rain */
    .rain-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .raindrop {
      position: absolute;
      width: 1px;
      background: linear-gradient(to bottom, transparent, rgba(150, 200, 255, .35));
      animation: rainFall linear infinite;
    }

    @keyframes rainFall {
      from {
        transform: translateY(-20px);
      }

      to {
        transform: translateY(110vh);
      }
    }

    /* Loader text */
    .loader-text {
      position: absolute;
      bottom: 18%;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Orbitron', sans-serif;
      font-size: .85rem;
      color: var(--accent);
      letter-spacing: .35em;
      text-transform: uppercase;
      white-space: nowrap;
      animation: txtPulse 1.8s ease-in-out infinite;
    }

    @keyframes txtPulse {

      0%,
      100% {
        opacity: 1;
        text-shadow: 0 0 14px var(--accent);
      }

      50% {
        opacity: .2;
        text-shadow: none;
      }
    }

    /* ─── Login Card ─────────────────────────── */
    .bg-grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(rgba(0, 212, 255, .03)1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, .03)1px, transparent 1px);
      background-size: 60px 60px;
    }

    .login-wrap {
      position: relative;
      z-index: 10;
      width: min(440px, 92%);
      padding: 50px 44px;
      background: linear-gradient(145deg, rgba(9, 22, 40, .97), rgba(5, 12, 26, .99));
      border: 1px solid rgba(0, 212, 255, .22);
      border-radius: 20px;
      box-shadow: 0 0 0 1px rgba(0, 212, 255, .06), 0 30px 80px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(0, 212, 255, .12);
      display: none;
      animation: cardIn .8s cubic-bezier(.16, 1, .3, 1);
    }

    @media (max-width: 480px) {
      .login-wrap {
        padding: 35px 24px;
      }

      .logo-title {
        font-size: 1.6rem;
      }

      .logo-icon {
        font-size: 2.5rem;
      }
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(28px) scale(.96);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .logo-area {
      text-align: center;
      margin-bottom: 34px;
    }

    .logo-icon {
      font-size: 3rem;
      display: block;
      margin-bottom: 8px;
      animation: iconGlow 2s ease-in-out infinite alternate;
    }

    @keyframes iconGlow {
      from {
        filter: drop-shadow(0 0 8px var(--gold));
      }

      to {
        filter: drop-shadow(0 0 24px var(--gold)) drop-shadow(0 0 48px var(--accent));
      }
    }

    .logo-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(90deg, var(--accent), #7df9ff, var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: .1em;
    }

    .logo-sub {
      font-size: .8rem;
      color: var(--dim);
      letter-spacing: .2em;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      font-size: .72rem;
      letter-spacing: .15em;
      color: var(--dim);
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .input-group input {
      width: 100%;
      padding: 13px 17px;
      background: rgba(0, 212, 255, .04);
      border: 1px solid rgba(0, 212, 255, .2);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      transition: all .3s;
      outline: none;
    }

    .input-group input:focus {
      border-color: var(--accent);
      background: rgba(0, 212, 255, .08);
      box-shadow: 0 0 20px rgba(0, 212, 255, .15);
    }

    .input-group input::placeholder {
      color: var(--dim);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #005fcc, var(--accent));
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: .88rem;
      font-weight: 700;
      letter-spacing: .15em;
      cursor: pointer;
      margin-top: 6px;
      transition: all .3s;
      position: relative;
      overflow: hidden;
    }

    .login-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent, rgba(255, 255, 255, .14), transparent);
      transform: translateX(-100%);
      transition: .5s;
    }

    .login-btn:hover::before {
      transform: translateX(100%);
    }

    .login-btn:hover {
      box-shadow: 0 0 30px rgba(0, 212, 255, .55);
      transform: translateY(-2px);
    }

    .divider {
      text-align: center;
      margin: 22px 0;
      position: relative;
      color: var(--dim);
      font-size: .78rem;
      letter-spacing: .1em;
    }

    .divider::before,
    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 38%;
      height: 1px;
      background: rgba(0, 212, 255, .15);
    }

    .divider::before {
      left: 0;
    }

    .divider::after {
      right: 0;
    }

    .demo-btn {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 1px solid rgba(0, 212, 255, .28);
      border-radius: 10px;
      color: var(--accent);
      font-family: 'Rajdhani', sans-serif;
      font-size: .92rem;
      font-weight: 600;
      letter-spacing: .1em;
      cursor: pointer;
      transition: all .3s;
    }

    .demo-btn:hover {
      background: rgba(0, 212, 255, .08);
      box-shadow: 0 0 18px rgba(0, 212, 255, .2);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 26px;
      padding: 9px 13px;
      border-radius: 8px;
      background: rgba(0, 230, 118, .07);
      border: 1px solid rgba(0, 230, 118, .18);
      font-size: .78rem;
      color: var(--success);
      letter-spacing: .07em;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      animation: dp 1.5s infinite;
    }

    @keyframes dp {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(0, 230, 118, .45);
      }

      50% {
        box-shadow: 0 0 0 5px rgba(0, 230, 118, 0);
      }
    }

    .err {
      color: var(--danger);
      font-size: .78rem;
      margin-top: 8px;
      text-align: center;
      min-height: 18px;
    }
  </style>
</head>

<body>
  <div class="bg-grid"></div>

  <!-- ─── LOADER ─────────────────────────────────────────────── -->
  <div id="loader">
    <div class="stars"></div>
    <div class="clouds">
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
      <div class="cloud c3"></div>
      <div class="cloud c4"></div>
    </div>
    <div class="rain-container" id="rain"></div>
    <div class="flash-overlay" id="flash"></div>

    <!-- SVG: realistic multi-layer bolt drawn procedurally via JS -->
    <svg id="bolt-svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet"></svg>

    <div class="ground-glow" id="glow"></div>
    <svg id="crack-svg"></svg>
    <div id="sparks-container"></div>
    <div class="loader-text" id="loader-text">Charging Up...</div>
  </div>

  <!-- ─── LOGIN CARD ──────────────────────────────────────────── -->
  <div class="login-wrap" id="card">
    <div class="logo-area">
      <span class="logo-icon">⚡</span>
      <div class="logo-title">WATTWISE</div>
      <div class="logo-sub">AI Energy Intelligence Platform</div>
    </div>
    <div class="input-group">
      <label>User ID / Email</label>
      <input type="text" id="uid" placeholder="Enter user ID" value="demo_user" />
    </div>
    <div class="input-group">
      <label>Access Code</label>
      <input type="password" id="pw" placeholder="••••••••" value="wattwise" />
    </div>
    <div class="err" id="err"></div>
    <button class="login-btn" onclick="doLogin()">⚡ ENTER DASHBOARD</button>
    <div class="divider">OR</div>
    <button class="demo-btn" onclick="demo()">🔍 View Demo — No Login Required</button>
    <div class="status-badge">
      <div class="dot"></div>WattWise connected — All systems operational
    </div>
  </div>

  <script>
    // Audio engine removed

    // ─── Rain generator ──────────────────────────────────────────────────────────
    function makeRain() {
      const container = document.getElementById('rain');
      for (let i = 0; i < 90; i++) {
        const d = document.createElement('div');
        d.className = 'raindrop';
        d.style.cssText = `left:${Math.random() * 100}%;height:${12 + Math.random() * 22}px;animation-duration:${0.45 + Math.random() * .8}s;animation-delay:${Math.random() * 2}s;top:-20px;`;
        container.appendChild(d);
      }
    }

    // ─── SVG Lightning ───────────────────────────────────────────────────────────
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const boltSVG = document.getElementById('bolt-svg');
    const flashEl = document.getElementById('flash');
    const glowEl = document.getElementById('glow');
    const crackSVG = document.getElementById('crack-svg');
    const sparksC = document.getElementById('sparks-container');

    let strikeTimeout = null;

    // Jagged bolt path generator
    function makeBoltPath(x1, y1, x2, y2, roughness = 0.4, segments = 14) {
      const dx = x2 - x1, dy = y2 - y1;
      const len = Math.sqrt(dx * dx + dy * dy);
      let pts = [{ x: x1, y: y1 }];
      const nx = -dy / len, ny = dx / len; // normal

      for (let i = 1; i < segments; i++) {
        const t = i / segments;
        const cx = x1 + dx * t, cy = y1 + dy * t;
        const jitter = (Math.random() - .5) * 2 * roughness * len * 0.18;
        pts.push({ x: cx + nx * jitter, y: cy + ny * jitter });
      }
      pts.push({ x: x2, y: y2 });
      return pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
    }

    function addDefs(svg) {
      const defs = document.createElementNS(SVG_NS, 'defs');
      // Glow filter
      defs.innerHTML = `
  <filter id="boltGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="blur1"/>
    <feGaussianBlur stdDeviation="10" result="blur2"/>
    <feGaussianBlur stdDeviation="22" result="blur3"/>
    <feMerge><feMergeNode in="blur3"/><feMergeNode in="blur2"/><feMergeNode in="blur1"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="boltCore" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur stdDeviation="1" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="boltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#ffffff"/>
    <stop offset="20%"  stop-color="#c8f4ff"/>
    <stop offset="55%"  stop-color="#00d4ff"/>
    <stop offset="85%"  stop-color="#ffd700"/>
    <stop offset="100%" stop-color="#ff8c00"/>
  </linearGradient>
  <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.15"/>
  </linearGradient>`;
      svg.appendChild(defs);
    }
    addDefs(boltSVG);

    function createBoltElement(pathD, strokeColor, strokeWidth, filter, opacity = 1) {
      const p = document.createElementNS(SVG_NS, 'path');
      p.setAttribute('d', pathD);
      p.setAttribute('stroke', strokeColor);
      p.setAttribute('stroke-width', strokeWidth);
      p.setAttribute('stroke-linecap', 'round');
      p.setAttribute('stroke-linejoin', 'round');
      p.setAttribute('fill', 'none');
      p.setAttribute('opacity', opacity);
      if (filter) p.setAttribute('filter', `url(#${filter})`);
      return p;
    }

    function strike() {
      // Clear previous
      while (boltSVG.children.length > 1) boltSVG.removeChild(boltSVG.lastChild);
      crackSVG.innerHTML = '';
      sparksC.innerHTML = '';
      glowEl.style.opacity = '0';

      // Randomize strike position slightly
      const sx = 420 + Math.random() * 160;  // start top (inside cloud area)
      const sy = 30 + Math.random() * 40;
      const ex = sx + (Math.random() - .5) * 120; // end at ground
      const ey = 590 + Math.random() * 30;

      // Generate main bolt + 2-3 branches
      const mainPath = makeBoltPath(sx, sy, ex, ey, 0.42, 16);

      // Branch 1: fork at ~40% down
      const b1x1 = sx + (ex - sx) * 0.38, b1y1 = sy + (ey - sy) * 0.38;
      const b1Path = makeBoltPath(b1x1, b1y1, b1x1 + (Math.random() > .5 ? 1 : -1) * (80 + Math.random() * 80), b1y1 + (60 + Math.random() * 80), 0.35, 8);

      // Branch 2: fork at ~65% down
      const b2x1 = sx + (ex - sx) * 0.6, b2y1 = sy + (ey - sy) * 0.6;
      const b2Path = makeBoltPath(b2x1, b2y1, b2x1 + (Math.random() > .5 ? 1 : -1) * (50 + Math.random() * 70), b2y1 + (40 + Math.random() * 60), 0.3, 6);

      // Branch 3 (short, from upper section)
      const b3x1 = sx + (ex - sx) * 0.22, b3y1 = sy + (ey - sy) * 0.22;
      const b3Path = makeBoltPath(b3x1, b3y1, b3x1 + (Math.random() > .5 ? 1 : -1) * (30 + Math.random() * 50), b3y1 + (25 + Math.random() * 35), 0.3, 5);

      // Layer: wide glow
      boltSVG.appendChild(createBoltElement(mainPath, 'url(#glowGrad)', 28, 'boltGlow', 0.6));
      // Layer: colored main bolt
      boltSVG.appendChild(createBoltElement(mainPath, 'url(#boltGrad)', 3.5, 'boltGlow', 1));
      // Layer: white core
      boltSVG.appendChild(createBoltElement(mainPath, 'rgba(255,255,255,0.92)', 1.1, 'boltCore', 1));

      // Branches (glow + colored)
      [b1Path, b2Path, b3Path].forEach((bp, i) => {
        const bw = [2.2, 1.8, 1.4][i];
        boltSVG.appendChild(createBoltElement(bp, 'url(#glowGrad)', bw, 'boltGlow', 0.75));
        boltSVG.appendChild(createBoltElement(bp, 'rgba(255,255,255,.7)', 0.7, 'boltCore', 0.8));
      });

      // Flash & glow at impact point
      const impactX = ex;
      const impactY = ey;
      const vw = window.innerWidth, vh = window.innerHeight;
      const gxPx = vw * (impactX / 1000);
      const gyPx = vh * (impactY / 700);

      glowEl.style.cssText = `width:220px;height:50px;left:${gxPx - 110}px;top:${gyPx - 20}px;opacity:0.95;`;
      flashEl.className = 'flash-overlay on';

      // Ground cracks
      crackSVG.style.cssText = `left:${gxPx - 90}px;top:${gyPx - 10}px;width:180px;height:55px;`;
      crackSVG.setAttribute('viewBox', '0 0 180 55');
      const crackPaths = [
        `M90,5 L${30 + Math.random() * 20},${28 + Math.random() * 10} L${8 + Math.random() * 18},${22 + Math.random() * 8}`,
        `M90,5 L${130 + Math.random() * 30},${24 + Math.random() * 10} L${152 + Math.random() * 20},${18 + Math.random() * 8}`,
        `M90,5 L${70 + Math.random() * 20},${38 + Math.random() * 10} L${58 + Math.random() * 18},${50 + Math.random() * 5}`,
        `M90,5 L${108 + Math.random() * 20},${35 + Math.random() * 12} L${120 + Math.random() * 18},${48 + Math.random() * 5}`,
        `M90,5 L${82 + Math.random() * 12},${20 + Math.random() * 8} L${75 + Math.random() * 14},${30 + Math.random() * 8}`,
      ];
      crackSVG.innerHTML = crackPaths.map(d =>
        `<path d="${d}" stroke="#00d4ff" stroke-width="1.2" fill="none" stroke-linecap="round" filter="url(#boltGlow)" opacity="0.8"/>
     <path d="${d}" stroke="rgba(255,255,255,.4)" stroke-width="0.5" fill="none" stroke-linecap="round"/>`
      ).join('');
      crackSVG.style.opacity = '1';

      // Sparks
      sparksC.innerHTML = '';
      const sparkColors = ['#ffd700', '#00d4ff', '#ffffff', '#ff9800'];
      for (let i = 0; i < 12; i++) {
        const sp = document.createElement('div');
        sp.className = 'spark';
        const angle = Math.random() * Math.PI * 2;
        const dist = 30 + Math.random() * 90;
        const tx = (Math.cos(angle) * dist).toFixed(0);
        const ty = (Math.sin(angle) * dist).toFixed(0);
        const col = sparkColors[Math.floor(Math.random() * sparkColors.length)];
        const dur = (200 + Math.random() * 350).toFixed(0);
        sp.style.cssText = `left:${gxPx}px;top:${gyPx}px;background:${col};box-shadow:0 0 6px ${col};
      animation:sparkFly ${dur}ms ease-out forwards;--tx:${tx}px;--ty:${ty}px;`;
        sparksC.appendChild(sp);
      }

      // Flicker: bolt on/off rapidly
      let fc = 0;
      const flicker = setInterval(() => {
        fc++;
        const vis = fc % 2 === 0 ? '1' : '0.05';
        boltSVG.style.opacity = vis;
        glowEl.style.opacity = fc % 2 === 0 ? '0.85' : '0.05';
        if (fc > 10) {
          clearInterval(flicker);
          boltSVG.style.opacity = '1';
        }
      }, 80);

      // Fade out after 2.4s then re-strike
      setTimeout(() => {
        boltSVG.style.transition = 'opacity 0.5s';
        boltSVG.style.opacity = '0';
        glowEl.style.opacity = '0';
        crackSVG.style.opacity = '0';
        sparksC.innerHTML = '';
        setTimeout(() => {
          boltSVG.style.transition = '';
          boltSVG.style.opacity = '1';
        }, 500);
      }, 2000);

      // Flicker: bolt on/off rapidly

      // Queue next strike
      const nextDelay = 2800 + Math.random() * 1800;
      clearTimeout(strikeTimeout);
      strikeTimeout = setTimeout(() => {
        if (document.getElementById('loader').style.display !== 'none') {
          strike();
        }
      }, nextDelay);
    }

    // Inject spark animation
    const style = document.createElement('style');
    style.textContent = `@keyframes sparkFly{0%{opacity:1;transform:translate(0,0)scale(1.5);}60%{opacity:.8;transform:translate(calc(var(--tx)*.7),calc(var(--ty)*.7))scale(.9);}100%{opacity:0;transform:translate(var(--tx),var(--ty))scale(0);}}`;
    document.head.appendChild(style);

    // ─── Init ────────────────────────────────────────────────────────────────────
    makeRain();

    // Start after brief delay
    setTimeout(() => { strike(); }, 400);

    // Dismiss loader after 4.5s
    setTimeout(() => {
      clearTimeout(strikeTimeout);
      const l = document.getElementById('loader');
      l.classList.add('out');
      setTimeout(() => {
        l.style.display = 'none';
        document.getElementById('card').style.display = 'block';
      }, 800);
    }, 4500);

    function doLogin() {
      const u = document.getElementById('uid').value.trim();
      const e = document.getElementById('err');
      if (!u) { e.textContent = 'Please enter your User ID'; return; }
      e.textContent = '';
      sessionStorage.setItem('ww_user', u);
      sessionStorage.setItem('ww_auth', 'true');
      window.location.href = '/';
    }
    function demo() {
      sessionStorage.setItem('ww_user', 'demo_user');
      sessionStorage.setItem('ww_auth', 'true');
      window.location.href = '/';
    }
    document.addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });

    // Register PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('WattWise SW Registered (Login):', reg.scope))
          .catch(err => console.error('PWA Registration Failed:', err));
      });
    }
  </script>
</body>

</html>
